services:
  # MongoDB Service
  mongo:
    image: mongo:7
    container_name: TutorAive-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: sahil
      MONGO_INITDB_ROOT_PASSWORD: 980980
      MONGO_INITDB_DATABASE: TutorAive-mongo
    ports:
      - "27017:27017"
    volumes:
      - backend_mongo_data:/data/db
    # Added Healthcheck with Authentication
    healthcheck:
      test: ["CMD", "mongosh", "--username", "sahil", "--password", "980980", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Service for Rate Limiting
  redis:
    image: redis:alpine
    container_name: TutorAive-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Your Backend API
  backend:
    build: .
    container_name: TutorAive-backend
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://sahil:980980@mongo:27017/TutorAive-mongo?authSource=admin
      - REDIS_URL=redis://redis:6379
    ports:
      - "5000:5000"

volumes:
    backend_mongo_data:
        external: true
    redis_data: